name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev pkg-config tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test

  browser:
    name: Browser suites
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev pkg-config tmux
      - run: pnpm install --frozen-lockfile
      - name: Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm run test:browser
